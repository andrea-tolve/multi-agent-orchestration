<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <style>
        body {font-family: Arial, sans-serif; text-align: center; margin-top: 50px;}
        button {font-size: 1.2em; margin: 10px; padding: 10px 20px;}
        #result {margin-top: 20px; font-size: 1.5em;}
    </style>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div>
        <button onclick="sendMove('rock')">Rock</button>
        <button onclick="sendMove('paper')">Paper</button>
        <button onclick="sendMove('scissors')">Scissors</button>
    </div>
    <div id="status">Waiting for your move...</div>
    <div id="result"></div>

    <script>
        function sendMove(move) {
            fetch('/api/rps/play', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({move: move})
            })
            .then(resp => resp.json())
            .then(data => {
                document.getElementById('status').innerText = 'Move sent. Waiting for opponent...';
            })
            .catch(err => console.error(err));
        }

        function pollStatus() {
            fetch('/api/status')
                .then(resp => resp.json())
                .then(data => {
                    if (data.completed === 'yes') {
                        document.getElementById('status').innerText = `You played ${data.local_move}, opponent played ${data.opponent_move}.`;
                        document.getElementById('result').innerText = `Result: ${data.result}`;
                    }
                })
                .catch(err => console.error(err));
        }

        setInterval(pollStatus, 2000);
    </script>
</body>
</html>
