<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <style>
        body {font-family: Arial, sans-serif; text-align: center; margin-top: 50px;}
        button {font-size: 1.2em; padding: 10px 20px; margin: 10px;}
        #result {margin-top: 30px; font-size: 1.5em; font-weight: bold;}
    </style>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div>
        <button onclick="sendMove('rock')">Rock</button>
        <button onclick="sendMove('paper')">Paper</button>
        <button onclick="sendMove('scissors')">Scissors</button>
    </div>
    <div id="result"></div>

    <script>
        async function sendMove(move) {
            const resp = await fetch('/api/rps/play', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({move})
            });
            if (!resp.ok) {
                const err = await resp.json();
                alert('Error: ' + err.message);
                return;
            }
            document.getElementById('result').textContent = 'Waiting for opponent...';
        }

        async function pollStatus() {
            try {
                const resp = await fetch('/api/status');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.completed === 'yes' && data.data) {
                        document.getElementById('result').textContent = 'Result: ' + data.data;
                    }
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }

        setInterval(pollStatus, 2000);
    </script>
</body>
</html>
