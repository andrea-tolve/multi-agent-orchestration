<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote RPS Player</title>
    <style>
        body {font-family: Arial, sans-serif; text-align: center; margin-top: 50px;}
        button {margin: 5px; padding: 10px 20px; font-size: 16px;}
        #result {margin-top: 20px; font-weight: bold;}
    </style>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div>
        <button onclick="sendMove('rock')">Rock</button>
        <button onclick="sendMove('paper')">Paper</button>
        <button onclick="sendMove('scissors')">Scissors</button>
    </div>
    <div id="result"></div>
    <script>
        async function sendMove(move) {
            const resp = await fetch('/api/rps/play', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({move})
            });
            const data = await resp.json();
            document.getElementById('result').innerText = data.message || 'Move sent';
        }

        async function pollStatus() {
            const resp = await fetch('/api/status');
            const status = await resp.json();
            if (status.completed === 'yes' && status.data) {
                const {player_move, opponent_move, result} = status.data;
                document.getElementById('result').innerText = `You played ${player_move}, opponent played ${opponent_move}. You ${result}!`;
            }
        }

        setInterval(pollStatus, 2000);
    </script>
</body>
</html>
